# Local Postgres + app + test runner.
#
#   docker compose up --build            # app on http://localhost:8000 (dev mode: open officer endpoints)
#   docker compose run --rm tests        # full pytest suite against a scratch Postgres
#
# If you created the db volume before scripts/init-test-db.sql existed, run
# `docker compose down -v` once so the gem_test database gets created.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gem
      POSTGRES_PASSWORD: gem
      POSTGRES_DB: gem
    ports:
      - "5433:5432"          # 5433 so it doesn't clash with a Postgres already on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gem -d gem"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gem:gem@db:5432/gem
      OFFICER_TOKENS: ${OFFICER_TOKENS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ENABLE_RESET: ${ENABLE_RESET:-false}
      APP_ENV: ${APP_ENV:-}
    ports:
      - "8000:8000"

  tests:
    build: .
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://gem:gem@db:5432/gem_test
    user: root
    command: sh -c "pip install -q -r requirements-dev.txt && python -m pytest -q"

volumes:
  pgdata:
