[project]
name = "gem-bid-compliance-platform"
version = "0.1.0"
description = "GeM Bid Compliance Verification Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "pikepdf>=9.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "prisma>=0.14.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.main:app"
