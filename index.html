<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="GeM Bid Verification Platform — a single console for GSTN, Income Tax, Udyam, MCA21, EPFO, DigiLocker, Startup India, NSIC and CPPP debarment checks, document parsing and a hash-chained audit trail.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23101F33'/%3E%3Ctext x='50' y='66' font-size='52' font-family='Georgia,serif' font-weight='700' fill='%23CFE0D8' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<title>GeM Bid Verification Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --navy:#101F33;
  --navy-2:#182A44;
  --paper:#F6F5F1;
  --paper-2:#EFEDE6;
  --ink:#1B2430;
  --slate:#6B7280;
  --hairline:#D9D6CC;
  --hairline-dark:#2A3A55;
  --emerald:#0E7C61;
  --emerald-bg:#E7F3EE;
  --amber:#B8791A;
  --amber-bg:#FBF1DF;
  --brick:#A63F35;
  --brick-bg:#F7E9E7;
  --critical:#7A1F1F;
  --critical-bg:#F3E2E0;
  --white:#FFFFFF;
  --radius-sm:4px;
  --radius:8px;
  --serif:'Lora',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::selection{background:#101f3322;}

/* ---------- Shell / layout ---------- */
#app{min-height:100vh;}
.hidden{display:none !important;}
.skip-link{
  position:absolute;left:-999px;top:auto;background:var(--navy);color:#fff;padding:10px 16px;
  border-radius:6px;z-index:1000;font-size:13px;font-weight:600;color-scheme:light;
}
.skip-link:focus{left:12px;top:12px;}

/* ---------- Top bar (portal views) ---------- */
.topbar{
  background:var(--navy);
  color:#EDEFF3;
  color-scheme:light;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 28px;
  border-bottom:1px solid var(--hairline-dark);
}
.topbar-brand{
  display:flex;align-items:center;gap:10px;
  font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.2px;
}
.topbar-brand .mark{
  width:28px;height:28px;border-radius:6px;
  background:linear-gradient(155deg,#2A4570,#101F33);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:600;color:#CFE0D8;
  border:1px solid #33507a;
}
.topbar-mid{display:flex;gap:4px;}
.topbar-tab{
  background:transparent;border:none;color:#B7C0D1;
  padding:8px 14px;font-size:13.5px;font-weight:500;border-radius:6px;
  transition:background .15s, color .15s;
}
.topbar-tab:hover{background:#1B2E4A;color:#fff;}
.topbar-tab.active{background:#22385A;color:#fff;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.topbar-user{
  font-size:13px;color:#C9D1DE;display:flex;flex-direction:column;align-items:flex-end;line-height:1.3;
}
.topbar-user b{color:#fff;font-weight:600;}
.topbar-user span{font-family:var(--mono);font-size:11px;color:#8592A8;}
.btn-ghost-dark{
  background:transparent;border:1px solid #3A4E70;color:#D7DDE8;
  padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;
  transition:background .15s;
}
.btn-ghost-dark:hover{background:#1B2E4A;}
.nav-link-dark{
  background:transparent;border:none;color:#93A0B8;font-size:12.5px;font-weight:500;
  text-decoration:underline;text-underline-offset:3px;
}
.nav-link-dark:hover{color:#fff;}

/* ---------- Portal body: sidebar + main ---------- */
.portal-body{
  display:grid;
  grid-template-columns:280px 1fr;
  min-height:calc(100vh - 58px);
}
@media (max-width:900px){
  .portal-body{grid-template-columns:1fr;}
  .sidebar{order:2;border-top:1px solid var(--hairline);border-right:none;}
}
.sidebar{
  background:var(--navy);
  color:#D7DDE8;
  color-scheme:light;
  padding:22px 20px 40px;
  border-right:1px solid var(--hairline-dark);
}
.sb-block{margin-bottom:26px;}
.sb-title{
  font-size:11px;font-weight:600;letter-spacing:.06em;color:#7E8CA6;
  margin:0 0 10px;
}
.sb-title.sc{margin-top:0;}
.sb-stat-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:5px 0;font-size:13px;color:#C9D1DE;
}
.sb-stat-row b{font-family:var(--mono);color:#fff;font-weight:600;}
.sb-req-list{margin:0;padding:0;list-style:none;}
.sb-req-list li{
  display:flex;gap:9px;padding:7px 0;font-size:12.5px;color:#B7C0D1;line-height:1.5;
  border-bottom:1px dashed #23334F;
}
.sb-req-list li:last-child{border-bottom:none;}
.sb-req-dot{
  width:6px;height:6px;border-radius:50%;background:#4C6289;margin-top:6px;flex:none;
}
.sb-portal-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;font-size:12.5px;font-family:var(--mono);color:#B7C0D1;
}
.sb-pill{
  font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;
  background:#123A2E;color:#5FD3A6;letter-spacing:.02em;
}
.sb-legend-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;color:#C9D1DE;}
.sb-swatch{width:11px;height:11px;border-radius:3px;flex:none;}
.sb-cta{
  margin-top:6px;width:100%;background:#1B2E4A;border:1px solid #2E4468;color:#D7DDE8;
  padding:10px;border-radius:6px;font-size:12.5px;font-weight:600;text-align:left;
}
.sb-cta:hover{background:#22385A;}

.main{padding:30px 34px 60px;}
.main-header{margin-bottom:22px;}
.main-header h1{
  font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 4px;color:var(--navy);
}
.main-header p{margin:0;color:var(--slate);font-size:14px;}

/* ---------- Cards, tables, generic ---------- */
.card{
  background:var(--white);border:1px solid var(--hairline);border-radius:var(--radius);
  padding:20px 22px;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:700px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 10px;border-radius:20px;letter-spacing:.01em;
}
.badge.low{background:var(--emerald-bg);color:var(--emerald);}
.badge.medium{background:var(--amber-bg);color:var(--amber);}
.badge.high{background:var(--brick-bg);color:var(--brick);}
.badge.critical{background:var(--critical-bg);color:var(--critical);}
.badge.neutral{background:#EEECE4;color:var(--slate);}
.badge.dotbadge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}

.status-pill{
  display:inline-block;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;
}
.status-pill.queued{background:#EEECE4;color:var(--slate);}
.status-pill.awaiting_decision{background:var(--amber-bg);color:var(--amber);}
.status-pill.approved{background:var(--emerald-bg);color:var(--emerald);}
.status-pill.clarification{background:#EAE3F3;color:#6A4C93;}
.status-pill.rejected{background:var(--brick-bg);color:var(--brick);}

.btn{
  border:none;border-radius:6px;padding:10px 18px;font-size:13.5px;font-weight:600;
  transition:filter .15s, background .15s;
}
.btn-primary{background:var(--navy);color:#fff;color-scheme:light;}
.btn-primary:hover{filter:brightness(1.15);}
.btn-primary:disabled{background:#B7BEC9;cursor:not-allowed;filter:none;}
.btn-outline{background:transparent;border:1px solid var(--hairline);color:var(--ink);}
.btn-outline:hover{background:var(--paper-2);}
.btn-approve{background:var(--emerald);color:#fff;color-scheme:light;}
.btn-approve:hover{filter:brightness(1.1);}
.btn-approve:disabled{background:#B7BEC9;cursor:not-allowed;filter:none;}
.btn-clarify{background:#6A4C93;color:#fff;color-scheme:light;}
.btn-clarify:hover{filter:brightness(1.1);}
.btn-clarify:disabled{background:#B7BEC9;cursor:not-allowed;filter:none;}
.btn-reject{background:var(--brick);color:#fff;color-scheme:light;}
.btn-reject:hover{filter:brightness(1.1);}
.btn-reject:disabled{background:#B7BEC9;cursor:not-allowed;filter:none;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:5px;}

/* ---------- Tabs (within portal) ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hairline);margin-bottom:22px;}
.tab-btn{
  background:transparent;border:none;padding:10px 4px;margin-right:22px;font-size:14px;
  font-weight:600;color:var(--slate);border-bottom:2px solid transparent;position:relative;top:1px;
}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--navy);}

/* ---------- Login screen ---------- */
.login-shell{
  min-height:100vh;display:grid;grid-template-columns:1fr 1fr;
}
@media (max-width:860px){
  .login-shell{grid-template-columns:1fr;}
  .login-brand{min-height:320px;}
  .float-cards{display:none;}
}
.login-brand{
  background:
    radial-gradient(circle at 15% 15%, #1B3157 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, #17294A 0%, transparent 50%),
    var(--navy);
  position:relative;overflow:hidden;
  padding:52px 48px;
  display:flex;flex-direction:column;justify-content:space-between;
  color:#fff;
  color-scheme:light;
}
.brand-shapes{position:absolute;inset:0;opacity:.5;pointer-events:none;}
.brand-shapes svg{width:100%;height:100%;}
.brand-top{position:relative;z-index:2;}
.brand-mark{
  display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;
  font-size:17px;margin-bottom:56px;
}
.brand-mark .mk{
  width:30px;height:30px;border-radius:7px;
  background:linear-gradient(155deg,#2A4570,#101F33);
  border:1px solid #33507a;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:#CFE0D8;
}
.brand-headline{
  font-family:var(--serif);font-weight:600;font-size:clamp(28px,3.4vw,38px);line-height:1.22;
  max-width:420px;margin:0 0 16px;
}
.brand-sub{color:#AEB9CE;font-size:14.5px;line-height:1.6;max-width:380px;margin:0;}
.float-cards{
  position:relative;z-index:2;height:260px;margin-top:20px;
}
.float-card{
  position:absolute;background:#152744;border:1px solid #2C4470;border-radius:10px;
  padding:14px 16px;width:190px;box-shadow:0 18px 40px -12px rgba(0,0,0,.55);
  cursor:grab;user-select:none;touch-action:none;
}
.float-card:active{cursor:grabbing;}
.float-card .fc-label{font-size:10px;letter-spacing:.05em;color:#7E8CA6;font-weight:600;margin-bottom:6px;}
.float-card .fc-value{font-family:var(--serif);font-size:23px;font-weight:600;color:#fff;}
.float-card .fc-sub{font-size:11px;color:#8FA3C0;margin-top:2px;font-family:var(--mono);}
.float-card .fc-chip{
  display:inline-block;margin-top:9px;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:20px;
}
.fc-chip.ok{background:#123A2E;color:#5FD3A6;}
.fc-chip.info{background:#1B2E4A;color:#8FB4E8;}
.brand-foot{position:relative;z-index:2;color:#6C7C9A;font-size:12px;}

.login-form-side{
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  padding:48px 34px;
}
.login-form-wrap{width:100%;max-width:378px;}
.login-form-wrap h2{
  font-family:var(--serif);font-size:23px;font-weight:600;margin:0 0 6px;color:var(--navy);
}
.login-form-wrap>p.lede{color:var(--slate);font-size:13.5px;margin:0 0 24px;}
.role-toggle{
  display:flex;background:#EAE7DE;border-radius:30px;padding:4px;margin-bottom:24px;
}
.role-toggle button{
  flex:1;border:none;background:transparent;padding:9px 0;border-radius:26px;
  font-size:13px;font-weight:600;color:var(--slate);transition:background .15s,color .15s;
}
.role-toggle button.active{background:var(--navy);color:#fff;color-scheme:light;}
.role-fields-wrap{overflow-x:hidden;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.field input,.field select{
  width:100%;padding:10px 12px;border:1px solid var(--hairline);border-radius:6px;
  font-size:13.5px;background:#fff;color:var(--ink);
}
.field select{appearance:auto;cursor:pointer;}
.field input:focus,.field select:focus{outline:2px solid #101F3333;border-color:var(--navy);}
.field .hint{font-size:11px;color:#9A9689;margin-top:5px;}
.tender-profile-note{
  font-size:11.5px;color:var(--slate);margin-top:6px;padding:8px 10px;
  background:var(--paper-2);border:1px solid var(--hairline);border-radius:6px;
}
.claims-group{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.claim-check{
  display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);cursor:pointer;
  padding:9px 12px;border:1px solid var(--hairline);border-radius:7px;background:#fff;
  transition:border-color .15s, background .15s;
}
.claim-check:has(input:checked){border-color:var(--navy);background:var(--paper-2);}
.claim-check input{width:15px;height:15px;accent-color:var(--navy);cursor:pointer;flex-shrink:0;}
.login-submit{
  width:100%;background:var(--navy);color:#fff;border:none;padding:12px;border-radius:6px;
  font-size:14px;font-weight:600;margin-top:6px;color-scheme:light;
}
.login-submit:hover{filter:brightness(1.15);}
.login-foot{margin-top:20px;text-align:center;font-size:12px;color:var(--slate);}
.login-foot button{background:none;border:none;text-decoration:underline;color:var(--navy);font-size:12px;font-weight:600;}

/* ---------- Verification trace ---------- */
.vqueue-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 16px;border:1px solid var(--hairline);border-radius:8px;background:#fff;margin-bottom:10px;
}
.vqueue-row:hover{border-color:#C7C2B3;}
.vqueue-left{display:flex;flex-direction:column;gap:3px;}
.vqueue-name{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--navy);}
.vqueue-meta{font-family:var(--mono);font-size:11px;color:var(--slate);}
.stage-track{display:flex;flex-direction:column;gap:0;margin:18px 0 6px;}
.stage-item{
  display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--hairline);
}
.stage-item:last-child{border-bottom:none;}
.stage-dot{
  width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;font-family:var(--mono);
  background:#EEECE4;color:#A6A192;border:1px solid #DEDACE;transition:all .25s;
}
.stage-dot.active{background:var(--navy);color:#fff;border-color:var(--navy);color-scheme:light;animation:pulse 1.1s ease-in-out infinite;}
.stage-dot.done{background:var(--emerald-bg);color:var(--emerald);border-color:#BFE1D3;}
.stage-dot.flag{background:var(--amber-bg);color:var(--amber);border-color:#F0D9A8;}
.stage-dot.critical{background:var(--critical-bg);color:var(--critical);border-color:#E0BEBB;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #101f3355;}50%{box-shadow:0 0 0 6px #101f3300;}}
.stage-body{flex:1;}
.stage-title{font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:3px;}
.stage-detail{font-size:12.5px;color:var(--slate);line-height:1.55;}
.stage-cv{
  display:flex;gap:22px;margin-top:8px;font-family:var(--mono);font-size:12px;
  background:var(--paper-2);border-radius:6px;padding:9px 12px;
}
.stage-cv div span{display:block;color:#9A9689;font-size:10px;font-family:var(--sans);font-weight:600;margin-bottom:2px;}
.stage-cv .mismatch{color:var(--brick);}
.stage-cv .match{color:var(--emerald);}

.score-hero{
  display:flex;align-items:center;gap:22px;padding:20px 22px;border:1px solid var(--hairline);
  border-radius:10px;background:linear-gradient(180deg,#fff,#FBFAF7);margin-bottom:18px;
}
.score-num{font-family:var(--serif);font-size:52px;font-weight:700;color:var(--navy);line-height:1;}
.score-num span{font-size:18px;color:var(--slate);font-weight:500;}
.score-meta h3{margin:0 0 4px;font-size:15px;}
.score-meta p{margin:0;font-size:12.5px;color:var(--slate);}

.decision-box{
  border:1px solid var(--hairline);border-radius:10px;padding:18px 20px;margin-top:20px;background:#fff;
}
.decision-box h3{margin:0 0 4px;font-size:15px;}
.decision-box p.sub{margin:0 0 14px;font-size:12.5px;color:var(--slate);}
.decision-box textarea{
  width:100%;min-height:80px;border:1px solid var(--hairline);border-radius:6px;padding:10px 12px;
  font-size:13px;resize:vertical;font-family:var(--sans);
}
.decision-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}

/* ---------- Audit log ---------- */
.audit-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.chain-status{font-size:12.5px;font-family:var(--mono);padding:6px 12px;border-radius:6px;}
.chain-status.ok{background:var(--emerald-bg);color:var(--emerald);}
.chain-status.checking{background:var(--paper-2);color:var(--slate);}
.audit-table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.audit-table{width:100%;min-width:640px;border-collapse:collapse;font-size:12.5px;}
.audit-table th{
  text-align:left;font-size:10.5px;letter-spacing:.04em;color:var(--slate);font-weight:600;
  padding:8px 10px;border-bottom:1px solid var(--hairline);
}
.audit-table td{padding:10px;border-bottom:1px solid #EFEDE6;vertical-align:top;}
.audit-table tr:hover td{background:#FBFAF7;}
.hash{font-family:var(--mono);font-size:11.5px;color:var(--slate);}
.hash b{color:var(--ink);}

/* ---------- Forms (submit bid) ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:700px){.form-grid{grid-template-columns:1fr;}}
.form-grid .field.full{grid-column:1/-1;}
.outcome-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px;}
@media (max-width:560px){.outcome-grid{grid-template-columns:1fr;}}
.outcome-opt{
  border:1px solid var(--hairline);border-radius:8px;padding:12px 14px;cursor:pointer;
  transition:border-color .15s,background .15s;
}
.outcome-opt:hover{border-color:#C7C2B3;}
.outcome-opt.sel{border-color:var(--navy);background:#F3F2ED;}
.outcome-opt .oo-title{font-size:13px;font-weight:600;margin-bottom:3px;}
.outcome-opt .oo-desc{font-size:11.5px;color:var(--slate);line-height:1.45;}
.upload-row{
  border:1px dashed var(--hairline);border-radius:8px;padding:14px;display:flex;justify-content:space-between;
  align-items:center;font-size:12.5px;color:var(--slate);margin-bottom:8px;
}
.upload-row b{color:var(--ink);font-weight:600;}
.upload-tag{font-size:10.5px;background:var(--emerald-bg);color:var(--emerald);padding:2px 8px;border-radius:12px;font-weight:600;}

/* ---------- Bid list ---------- */
.bid-row{
  border:1px solid var(--hairline);border-radius:8px;padding:15px 18px;margin-bottom:10px;background:#fff;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.bid-row-left{flex:1;min-width:220px;}
.bid-row-left h4{margin:0 0 4px;font-family:var(--serif);font-size:15px;color:var(--navy);}
.bid-row-left .meta{font-family:var(--mono);font-size:11px;color:var(--slate);}
.bid-row-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:160px;}
.officer-note{

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;
  box-shadow:0 12px 28px -8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .25s;z-index:999;
  color-scheme:light;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--slate);font-size:13.5px;
  border:1px dashed var(--hairline);border-radius:10px;
}

/* ---------- Page-to-page slide transition ---------- */
#app{overflow-x:hidden;}
.page-slide{
  opacity:1;transform:translateX(0);
  transition:opacity 260ms cubic-bezier(.4,0,.2,1), transform 260ms cubic-bezier(.4,0,.2,1);
  will-change:opacity, transform;
}
.page-slide.page-enter{opacity:0;transform:translateX(28px);}
.page-slide.page-exit{opacity:0;transform:translateX(-28px);}
@media (prefers-reduced-motion:reduce){
  .page-slide, .page-slide.page-enter, .page-slide.page-exit{transition:none;transform:none;opacity:1;}
}

/* ---------- Document uploads (submit bid) ---------- */
.doc-upload{
  border:1px solid var(--hairline);border-radius:8px;padding:13px 15px;display:flex;
  justify-content:space-between;align-items:center;gap:14px;margin-bottom:8px;background:#fff;

}

.du-filename{font-size:11.5px;color:var(--slate);font-family:var(--mono);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

}

}
.du-remove:hover{background:var(--brick-bg);color:var(--brick);border-color:#E7C6C1;}

/* ---------- Decision select (officer) ---------- */
.decision-select{display:flex;flex-direction:column;gap:8px;}

  border:1px solid var(--hairline);border-radius:8px;padding:12px 14px;cursor:pointer;

}

}

  color: var(--slate);
}
.decision-committed{display:flex;gap:14px;align-items:flex-start;}
.dc-icon{
  width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;

}
.decision-committed.approved .dc-icon{background:var(--emerald-bg);color:var(--emerald);}

.decision-committed.rejected .dc-icon{background:var(--brick-bg);color:var(--brick);}
.dc-body b{font-size:13.5px;color:var(--ink);}
.dc-body p{margin:5px 0 0;font-size:13px;color:var(--slate);line-height:1.55;}
.dc-hash{margin-top:9px;font-family:var(--mono);font-size:11px;color:var(--slate);}
.field-error{
  color:var(--brick);font-size:12px;font-weight:500;margin-top:10px;padding:9px 12px;
  background:var(--brick-bg);border-radius:6px;
}
.btn-primary.busy{opacity:.65;cursor:default;}
#justification.invalid{border-color:var(--brick);}
@keyframes shakeX{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-6px);}
  40%{transform:translateX(5px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(3px);}
}
.decision-select.shake{animation:shakeX .4s ease;}

/* ---------- Compliance Evidence Certificate Modal ---------- */
.evidence-backdrop{
  position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(16,31,51,0.72);
  backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;
}

}

function newId(prefix){
  if(window.crypto && typeof crypto.randomUUID === "function") return prefix + "_" + crypto.randomUUID();
  // Fallback for environments without crypto.randomUUID: timestamp + random keeps collisions effectively impossible.
  return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,10);
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.bids)) return parsed;
    }
  }catch(e){
    // Corrupt or inaccessible storage — fall back to fresh seed data rather than crashing.
    console.warn("GeM platform: could not read saved state, starting from seed data.", e);
  }
  return { bids: seedVendorBids(), auditLog: [], session:null, chainSeeded:false };
}
let storageWarned = false;
function persist(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    // Storage can fail (quota exceeded, private/incognito mode, disabled storage).
    // Silently losing the user's work is worse than a one-time warning.
    if(!storageWarned){
      storageWarned = true;
      const t = document.getElementById("toast");
      if(t){
        t.textContent = "Warning: this browser can't save changes locally (storage may be full or disabled) — actions in this session may be lost on reload.";
        t.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(()=>t.classList.remove("show"), 5000);
      }
    }
    return false;
  }
}

/* =======================================================================
   SCORING
======================================================================= */
function computeScore(flags){
  if(flags.includes("debarment_match")){
    return { score:0, risk:"critical" };
  }
  let score = 100;
  flags.forEach(f=>{ if(DEDUCTIONS[f]) score -= DEDUCTIONS[f].amount; });
  let risk;
  if(score>=RISK_THRESHOLDS.low) risk="low";
  else if(score>=RISK_THRESHOLDS.medium) risk="medium";
  else if(score>=RISK_THRESHOLDS.high) risk="high";
  else risk="critical";
  return { score, risk };
}
function riskLabel(r){ return {low:"Low risk",medium:"Medium risk",high:"High risk",critical:"Critical"}[r] || r; }

/* =======================================================================
   HASH-CHAINED AUDIT LOG
======================================================================= */
async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function appendAudit(actor, action, bidId, details){
  const prevHash = state.auditLog.length ? state.auditLog[state.auditLog.length-1].hash : "GENESIS";
  const seq = state.auditLog.length + 1;
  const timestamp = new Date().toISOString();
  const payload = JSON.stringify({seq,timestamp,actor,action,bidId,details,prevHash});
  const hash = await sha256Hex(payload);
  state.auditLog.push({seq,timestamp,actor,action,bidId,details,prevHash,hash});
  persist();
}
async function verifyChain(){
  let prevHash = "GENESIS";
  for(const entry of state.auditLog){
    if(entry.prevHash !== prevHash) return {ok:false, brokenAt:entry.seq, reason:"prevHash mismatch"};
    const payload = JSON.stringify({seq:entry.seq,timestamp:entry.timestamp,actor:entry.actor,action:entry.action,bidId:entry.bidId,details:entry.details,prevHash:entry.prevHash});
    const recomputed = await sha256Hex(payload);
    if(recomputed !== entry.hash) return {ok:false, brokenAt:entry.seq, reason:"hash mismatch"};
    prevHash = entry.hash;
  }
  return {ok:true, count:state.auditLog.length};
}

function toast(msg){

  clearTimeout(toast._t);

/* Every view (a full page/tab change) mounts through this so a slide
   transition plays between pages. Pass quiet=true for in-page updates
   (a verification stage advancing, a decision being recorded, a login
   role toggle) that should refresh content without sliding the page. */
const PAGE_TRANSITION_MS = 260;
function computeView(){
  if(route.view === "resources") return { html: renderResources(), wire: wireResources, key:"resources" };
  if(route.view === "resourceDetail") return { html: renderResourceDetail(route.slug), wire: wireResourceDetail, key:"resourceDetail:"+route.slug };
  if(!state.session) return { html: renderLogin(), wire: wireLogin, key:"login" };
  if(state.session.role === "bidder") return { html: renderBidderShell(), wire: wireBidderShell, key:"bidder:"+(route.tab||"mybids") };
  return { html: renderOfficerShell(), wire: wireOfficerShell, key:"officer:"+(route.tab||"queue")+":"+(route.openBid||"") };
}
function render(quiet){
  const app = document.getElementById("app");
  let view;
  try{
    view = computeView();
  }catch(err){
    console.error("GeM platform: render failed", err);
    app.innerHTML = `<div style="max-width:640px;margin:60px auto;padding:24px;border:1px solid #A63F35;background:#F7E9E7;border-radius:8px;font-family:sans-serif;color:#1B2430;">
      <h2 style="margin:0 0 10px;color:#A63F35;">Something went wrong while loading this page.</h2>
      <p style="margin:0 0 10px;font-size:13.5px;">This is unexpected — please reload the page. If it keeps happening, open the browser console (right-click → Inspect → Console) and share the red error text shown there.</p>
      <pre style="white-space:pre-wrap;font-size:12px;background:#fff;padding:10px;border-radius:6px;border:1px solid #E7C6C1;">${escapeHtml(String(err && err.stack || err))}</pre>
    </div>`;
    return;
  }
  const existing = app.querySelector(".page-slide");
  const sameKey = existing && existing.dataset.key === view.key;

  if(quiet || !existing || sameKey){
    // in-place refresh: no slide, just swap content
    app.innerHTML = `<div class="page-slide" data-key="${view.key}">${view.html}</div>`;
    safeWire(view.wire);
    return;
  }
  // page change: slide old content out, new content in
  existing.classList.add("page-exit");
  setTimeout(()=>{
    app.innerHTML = `<div class="page-slide page-enter" data-key="${view.key}">${view.html}</div>`;
    const el = app.querySelector(".page-slide");
    // force reflow so the enter transition actually plays
    void el.offsetWidth;
    requestAnimationFrame(()=>{ el.classList.remove("page-enter"); });
    safeWire(view.wire);
  }, PAGE_TRANSITION_MS);
}
function safeWire(wireFn){
  if(!wireFn) return;
  try{
    wireFn();
  }catch(err){
    // If wiring throws, the page still shows but buttons would silently do
    // nothing — that failure mode is worse than a visible warning, so surface it.
    console.error("GeM platform: wiring this page's interactions failed", err);
    const t = document.getElementById("toast");
    if(t){
      t.textContent = "Something on this page didn't load correctly — buttons here may not respond. Try reloading.";
      t.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(()=>t.classList.remove("show"), 6000);
    }
  }
}

function wireDraggable(){
  const wrap = document.getElementById("floatCards");
  if(!wrap) return;
  wrap.querySelectorAll(".float-card").forEach(card=>{
    let dragging=false, startX=0, startY=0, origX=0, origY=0;
    const down = (e)=>{
      dragging=true;
      card.dataset.dragging = "1";
      card.style.transform = "translate(0px,0px)";
      const p = e.touches? e.touches[0] : e;
      startX=p.clientX; startY=p.clientY;
      origX = parseFloat(card.style.left)||0; origY = parseFloat(card.style.top)||0;
      card.style.zIndex = 10;
      e.preventDefault();
    };
    const move = (e)=>{
      if(!dragging) return;
      const p = e.touches? e.touches[0] : e;
      const dx = p.clientX-startX, dy = p.clientY-startY;
      let nx = origX+dx, ny = origY+dy;
      nx = Math.max(-20, Math.min(nx, wrap.clientWidth-140));
      ny = Math.max(-10, Math.min(ny, wrap.clientHeight-60));
      card.style.left = nx+"px"; card.style.top = ny+"px";
    };
    const up = ()=>{ dragging=false; card.dataset.dragging = "0"; };
    card.addEventListener("mousedown", down);
    card.addEventListener("touchstart", down, {passive:false});
    window.addEventListener("mousemove", move);
    window.addEventListener("touchmove", move, {passive:false});
    window.addEventListener("mouseup", up);
    window.addEventListener("touchend", up);
  });
}

/* Ambient float + mouse-proximity parallax for the login preview cards —
   they drift on their own, and lean toward the cursor when it hovers
   nearby, without needing to be dragged. Self-terminates once the
   login page (and #floatCards) is no longer in the DOM. */
function wireFloatAmbient(){
  const wrap = document.getElementById("floatCards");
  if(!wrap) return;
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduceMotion) return;
  const cards = Array.from(wrap.querySelectorAll(".float-card"));
  if(!cards.length) return;
  let mouseX = 0, mouseY = 0; // normalized -1..1, relative to the card area
  const onMove = (e)=>{
    const rect = wrap.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    mouseX = Math.max(-1, Math.min(1, (p.clientX-cx) / ((rect.width||1)/2)));
    mouseY = Math.max(-1, Math.min(1, (p.clientY-cy) / ((rect.height||1)/2)));
  };
  const reset = ()=>{ mouseX = 0; mouseY = 0; };
  wrap.addEventListener("mousemove", onMove);
  wrap.addEventListener("mouseleave", reset);
  const brand = wrap.closest(".login-brand");
  if(brand){ brand.addEventListener("mousemove", onMove); brand.addEventListener("mouseleave", reset); }

  const start = performance.now();
  function tick(now){
    if(!document.body.contains(wrap)){ return; } // login page unmounted — stop looping
    const t = (now-start)/1000;
    cards.forEach((card,i)=>{
      if(card.dataset.dragging === "1") return;
      const depth = parseFloat(card.dataset.depth)||0.7;
      const phase = i*2.3;
      const bobX = Math.cos(t*0.55 + phase) * 4 * depth;
      const bobY = Math.sin(t*0.8 + phase) * 8 * depth;
      const leanX = mouseX * 16 * depth;
      const leanY = mouseY * 12 * depth;
      card.style.transform = `translate(${(bobX+leanX).toFixed(1)}px, ${(bobY+leanY).toFixed(1)}px)`;
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function wireSubmitBid(){
  let chosen = "clean";
  const attached = {}; // docId -> {name, size}
  const claimBoxes = {
    isReseller: document.getElementById("claimReseller"),
    claimsStartup: document.getElementById("claimStartup"),
    claimsNsic: document.getElementById("claimNsic"),
    claimsBisDpiit: document.getElementById("claimBisDpiit")
  };
  const submitBtn = document.getElementById("submitBidBtn");
  const docCountEl = document.getElementById("docCount");
  const tenderSelect = document.getElementById("sbTenderCategory");
  const tenderNoteEl = document.getElementById("tenderProfileNote");
  function currentTenderProfile(){ return tenderProfile(tenderSelect ? tenderSelect.value : null); }

  // A doc is required either unconditionally, because the vendor checked the
  // matching claim box, or because the selected tender category mandates it
  // (e.g. BIS certification for electronics/IT goods tenders) regardless of claim.
  function isDocRequired(d){
    if(d.required) return true;
    if(d.conditionOn && claimBoxes[d.conditionOn] && claimBoxes[d.conditionOn].checked) return true;
    if(d.profileRequired && d.profileRequired(currentTenderProfile())) return true;
    return false;
  }
  function currentRequiredIds(){
    return DOC_TYPES.filter(isDocRequired).map(d=>d.id);
  }
  function refreshConditionalBadges(){
    DOC_TYPES.filter(d=>d.conditionOn || d.profileRequired).forEach(d=>{
      const badge = document.getElementById("badge_"+d.id);
      if(!badge) return;
      const isNowRequired = isDocRequired(d);
      badge.textContent = isNowRequired ? "Required" : "Optional";
      badge.className = isNowRequired ? "du-required" : "du-optional";
    });
  }
  function updateSubmitState(){
    const requiredIds = currentRequiredIds();
    const count = requiredIds.filter(id=>attached[id]).length;
    docCountEl.textContent = `${count}/${requiredIds.length} required attached`;
    const ready = count === requiredIds.length;
    submitBtn.disabled = !ready;
    submitBtn.textContent = ready ? "Submit bid" : "Attach required documents to continue";
  }
  function formatSize(bytes){
    if(bytes < 1024) return bytes + " B";
    if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + " KB";
    return (bytes/1024/1024).toFixed(1) + " MB";
  }

  Object.values(claimBoxes).forEach(box=>{
    if(!box) return;
    box.addEventListener("change", ()=>{
      refreshConditionalBadges();
      updateSubmitState();
    });
  });
  if(tenderSelect){
    tenderSelect.addEventListener("change", ()=>{
      const p = currentTenderProfile();
      if(tenderNoteEl) tenderNoteEl.textContent = p.note;
      refreshConditionalBadges();
      updateSubmitState();
    });
  }

  DOC_TYPES.forEach(d=>{
    const input = document.getElementById("file_"+d.id);
    const row = document.querySelector(`.doc-upload[data-doc="${d.id}"]`);
    const fn = document.getElementById("fn_"+d.id);
    const rm = document.getElementById("rm_"+d.id);
    input.addEventListener("change", ()=>{
      const f = input.files && input.files[0];
      if(!f) return;
      attached[d.id] = { name:f.name, size:f.size };
      fn.textContent = f.name + " · " + formatSize(f.size);
      row.classList.add("has-file");
      rm.classList.remove("hidden");
      updateSubmitState();
    });
    rm.addEventListener("click", ()=>{
      delete attached[d.id];
      input.value = "";
      fn.textContent = "No file chosen";
      row.classList.remove("has-file");
      rm.classList.add("hidden");
      updateSubmitState();
    });
  });
  updateSubmitState();

  document.querySelectorAll(".outcome-opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      document.querySelectorAll(".outcome-opt").forEach(o=>o.classList.remove("sel"));
      el.classList.add("sel"); chosen = el.dataset.outcome;
    });
  });
  document.getElementById("submitForm").addEventListener("submit", e=>{
    e.preventDefault();
    if(submitBtn.disabled) return;
    const flagsMap = {
      clean: [],
      tamper_detected: ["document_tamper_detected"],
      turnover_mismatch: ["turnover_inflation"],
      lapsed_filing: ["lapsed_filing"],
      lapsed_itr: ["lapsed_itr_filing"],
      local_content_mismatch: ["local_content_mismatch"],
      document_tamper: ["document_authenticity_mismatch"],
      debarred_director: ["debarment_match"]
    };
    // If a real server is available, POST the first attached file to /api/verify
    (async ()=>{
      try{
        // find the first actual File object from inputs
        let fileInput = null; let fileObj = null;
        for(const d of DOC_TYPES){
          const inp = document.getElementById('file_'+d.id);
          if(inp && inp.files && inp.files[0]){ fileInput = inp; fileObj = inp.files[0]; break; }
        }
        if(fileObj){
          const fd = new FormData();
          fd.append('file', fileObj, fileObj.name);
          fd.append('bidder_name', state.session.company || "Anonymous");
          fd.append('tender_id', tenderSelect ? tenderSelect.value : "GEM-UNKNOWN");
          const res = await fetch('/api/verify', { method:'POST', body: fd });
          const j = await res.json();
          if(!res.ok) throw new Error(j.detail || JSON.stringify(j));
          // refresh authoritative state from server and show the new bid
          await fetchServerState();
          toast('Bid submitted — verification started (server id: '+(j.bid_id||'')+').');
          setRoute({ tab:'mybids' });
          return;
        }
      }catch(e){ console.warn('Server verify failed, falling back to local queue', e); }

      // fallback: create a local queued bid when server not available
      const bid = mkBid({
        company: state.session.company,
        tenderCategory: tenderSelect ? tenderSelect.value : "goods-general",
        gstin: document.getElementById("sbGstin").value.trim(),
        pan: document.getElementById("sbPan").value.trim(),
        cin: document.getElementById("sbCin").value.trim(),
        udyam: document.getElementById("sbUdyam").value.trim(),
        claimedTurnover: Number(document.getElementById("sbTurnover").value)||0,
        claimedLocalContent: Number(document.getElementById("sbLocal").value)||0,
        isReseller: claimBoxes.isReseller && claimBoxes.isReseller.checked,
        claimsStartup: claimBoxes.claimsStartup && claimBoxes.claimsStartup.checked,
        claimsNsic: claimBoxes.claimsNsic && claimBoxes.claimsNsic.checked,
        claimsBisDpiit: claimBoxes.claimsBisDpiit && claimBoxes.claimsBisDpiit.checked,
        flags: flagsMap[chosen] || [],
        status:"queued",
        submittedBy: state.session.company
      });
      bid.documents = DOC_TYPES.filter(d=>attached[d.id]).map(d=>({ id:d.id, title:d.title, name:attached[d.id].name }));
      state.bids.unshift(bid);
      persist();
      toast("Bid submitted — it's now in the officer's verification queue.");
      setRoute({ tab:"mybids" });
    })();
  });
}

function renderVerificationDetail(bid){
  const alreadyRun = bid.status !== "queued" || runState && runState.bidId===bid.id;
  const stages = buildStages(bid);
  const stageIndex = (runState && runState.bidId===bid.id) ? runState.stageIndex : (bid.score!==null ? stages.length : -1);
  const showScore = bid.score !== null || (stageIndex>=stages.length);

  return `
  <button class="btn btn-outline btn-sm" id="backToQueue" style="margin-bottom:18px;">← Back to queue</button>
  <div class="main-header">
    <h1>${escapeHtml(bid.company)}</h1>
    <p>${escapeHtml(tenderProfile(bid.tenderCategory).label)} tender · GSTIN ${escapeHtml(bid.gstin)} · PAN ${escapeHtml(bid.pan)} · CIN ${escapeHtml(bid.cin)} · Udyam ${escapeHtml(bid.udyam)}</p>
  </div>

  ${stageIndex < 0 ? `
    <div class="card">
      <p style="margin:0 0 14px;color:var(--slate);font-size:13.5px;">Claimed turnover ₹${bid.claimedTurnover.toLocaleString("en-IN")} · Claimed local content ${bid.claimedLocalContent}%.</p>
      <button class="btn btn-primary" id="runVerification">Run verification</button>
    </div>
  ` : `
    <div class="card">
      <div class="stage-track">
        ${stages.map((s,i)=>{
          let dotClass = "";
          let show = i <= stageIndex;
          if(!show) dotClass="";
          else if(i === stageIndex && stageIndex < stages.length-1 && runState && runState.running) dotClass="active";
          else dotClass = s.state==="flag" ? "flag" : (s.state==="critical" ? "critical" : "done");
          return `
          <div class="stage-item" style="opacity:${show?1:0.28};">
            <div class="stage-dot ${show?dotClass:''}">${show ? (dotClass==='active' ? '' : (dotClass==='flag'?'!':dotClass==='critical'?'✕':'✓')) : ''}</div>
            <div class="stage-body">
              <div class="stage-title">${s.title}</div>
              ${show ? `<div class="stage-detail">${s.detail}</div>` : ""}
              ${show && s.cv ? `<div class="stage-cv">${s.cv.map(c=>`<div><span>${c.label}</span><span class="${c.cls}">${c.value}</span></div>`).join("")}</div>` : ""}
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>
  `}

  ${showScore ? renderScoreAndDecision(bid) : ""}
  `;
}
const DECISION_ACTIONS = [
  { id:"approved", cls:"approved", label:"Approve", desc:"Bid passes verification — the tender award can proceed." },
  { id:"clarification", cls:"clarification", label:"Request clarification", desc:"Send back to the vendor for an explanation before any award decision." },
  { id:"rejected", cls:"rejected", label:"Reject", desc:"Bid fails verification and is disqualified from this tender." }
];
function recommendedAction(risk){
  if(risk==="low") return "approved";
  if(risk==="critical") return "rejected";
  return "clarification";
}
let decisionDraft = null;
function ensureDraft(bid){
  if(!decisionDraft || decisionDraft.bidId !== bid.id){
    decisionDraft = { bidId: bid.id, action:null, text:"", pending:false };
  }
  return decisionDraft;
}
function decisionCommitLabel(action){
  if(!action) return "Select an action to continue";
  return "Commit: " + (action==="approved" ? "Approve bid" : action==="clarification" ? "Request clarification" : "Reject bid");
}

function renderScoreAndDecision(bid){
  const decided = ["approved","clarification","rejected"].includes(bid.status);
  let box;
  if(decided){
    const entry = state.auditLog.slice().reverse().find(e=>e.bidId===bid.id && e.action==="decision_"+bid.status);
    box = `
      <div class="decision-committed ${bid.status}">
        <div class="dc-icon">${bid.status==="approved"?"✓":bid.status==="rejected"?"✕":"i"}</div>
        <div class="dc-body">
          <b>Decision recorded: ${statusLabel(bid.status)}</b>
          <p>${escapeHtml(bid.officerNote||"")}</p>
          ${entry ? `<div class="dc-hash">Chained to audit entry #${entry.seq} · <span class="hash">${entry.hash.slice(0,10)}…</span> · ${formatDateTime(entry.timestamp)} · permanent</div>` : ""}
        </div>
      </div>`;
  } else {
    const draft = ensureDraft(bid);
    // Prefer server recommendation when available (adapter populates this), fall back to local heuristic
    let rec = recommendedAction(bid.risk);
    if(bid.serverRecommendation && bid.serverRecommendation.recommended_action){
      const s = String(bid.serverRecommendation.recommended_action).toLowerCase();
      if(s === 'approve') rec = 'approved';
      else if(s === 'clarify') rec = 'clarification';
      else if(s === 'reject') rec = 'rejected';
    }
    const len = draft.text.trim().length;
    box = `
      <p class="sub">Choose an action, record the reasoning, then commit — this writes a permanent, hash-chained entry to the audit log.</p>
      <div class="decision-select" id="decisionSelect">

function wireQueueDetailInteractions(bid){
  document.getElementById("backToQueue").addEventListener("click", ()=>{
    runState = null; decisionDraft = null; setRoute({ openBid:null });
  });
  const evBtn = document.getElementById("btnViewEvidenceReport");
  if(evBtn){
    evBtn.addEventListener("click", ()=> showEvidenceModal(bid));
  }
  const noticeBtn = document.getElementById("btnGenerateNotice");
  if(noticeBtn){
    noticeBtn.addEventListener("click", ()=> showNoticeModal(bid));
  }
  const runBtn = document.getElementById("runVerification");
  if(runBtn){
    runBtn.addEventListener("click", ()=> runVerificationSequence(bid));
  }

  // Check Cartel & Collusion Risk for this Bid
  (async ()=>{
    const mount = document.getElementById("collusionMount_" + bid.id);
    if(!mount) return;
    try{
      const r = await fetch('/api/bids/' + encodeURIComponent(bid.id) + '/collusion-risk');
      if(!r.ok) return;
      const data = await r.json();
      if(data.has_collusion_risk && data.linked_competitors && data.linked_competitors.length > 0){
        mount.innerHTML = `
          <div class="in-bid-collusion-card">
            <span class="icon">⚠️</span>
            <div style="flex:1;">
              <h4>Cartel &amp; Collusion Alert · Section 3(3) Competition Act 2002</h4>
              <p>Forensic cross-correlation detected <b>${data.linked_competitors.length} suspicious link(s)</b> with competitors on this tender:</p>
              <ul style="margin:6px 0 0 16px;padding:0;font-size:12px;color:#78350F;">
                ${data.linked_competitors.map(c=>`<li><b>${escapeHtml(c.competitor_name)}</b> — ${escapeHtml(c.evidence)} (${Math.round(c.confidence*100)}% match)</li>`).join("")}
              </ul>
            </div>
          </div>`;
      }
    }catch(e){ console.warn('Could not check bid collusion risk', e); }
  })();
  const decided = ["approved","clarification","rejected"].includes(bid.status);

  if(!decided && bid.score!==null){
    const draft = ensureDraft(bid);
    const decisionSelect = document.getElementById("decisionSelect");
    const errorEl = document.getElementById("decisionError");
    document.querySelectorAll(".decision-opt").forEach(el=>{
      el.addEventListener("click", ()=>{
        if(draft.pending) return;
        draft.action = el.dataset.action;
        if(errorEl) errorEl.style.display = "none";
        render(true);
      });
    });
    const justi = document.getElementById("justification");
    const commitBtn = document.getElementById("commitDecisionBtn");
    const charCount = document.getElementById("charCount");
    if(justi){
      justi.addEventListener("input", ()=>{
        draft.text = justi.value;
        const len = draft.text.trim().length;
        charCount.textContent = `${len}/20 min`;
        commitBtn.textContent = decisionCommitLabel(draft.action);
        if(errorEl && errorEl.style.display !== "none" && len>=20){ errorEl.style.display = "none"; justi.classList.remove("invalid"); }
      });
    }
    if(commitBtn){
      commitBtn.addEventListener("click", ()=>{
        if(draft.pending) return;
        const len = draft.text.trim().length;
        if(!draft.action){
          if(errorEl){ errorEl.textContent = "Choose Approve, Request clarification, or Reject above before committing."; errorEl.style.display = "block"; }
          if(decisionSelect){ decisionSelect.classList.remove("shake"); void decisionSelect.offsetWidth; decisionSelect.classList.add("shake"); }
          return;
        }
        if(len < 20){
          if(errorEl){ errorEl.textContent = `Add a bit more detail — justification needs at least 20 characters (currently ${len}).`; errorEl.style.display = "block"; }
          if(justi){ justi.classList.add("invalid"); justi.focus(); }
          return;
        }
        commitDecision(bid, draft.action, draft.text.trim());
      });
    }
    // Try to fetch server-side recommendation asynchronously (non-blocking)
    if(!bid.serverRecommendation){
      (async ()=>{
        try{
          const r = await fetch('/api/bids/'+encodeURIComponent(bid.id)+'/recommendation');
          if(!r.ok) return;
          const jr = await r.json();
          // attach server recommendation for render to use
          bid.serverRecommendation = jr;
          render(true);
        }catch(e){ console.warn('Could not fetch recommendation', e); }
      })();
    }
  }

  // Load AI Executive Intelligence Brief
  async function loadAiSummary(force = false){

          document.querySelectorAll(".decision-opt").forEach(el=>{
            el.classList.toggle("sel", el.dataset.action === draft.action);
          });
          if(commitBtn) commitBtn.textContent = decisionCommitLabel(draft.action);

      });
    }
  }

  if(bid.score !== null){
    loadAiSummary();
  }
}
async function runVerificationSequence(bid){
  const stages = buildStages(bid);
  runState = { bidId: bid.id, stageIndex:0, running:true };
  render(true);
  for(let i=0;i<stages.length;i++){
    runState.stageIndex = i;
    runState.running = i < stages.length-1;
    render(true);
    await sleep(i===0?450:650);
  }
  const {score, risk} = computeScore(bid.flags);
  bid.score = score; bid.risk = risk; bid.status = "awaiting_decision"; bid.verifiedAt = new Date().toISOString();
  runState.stageIndex = stages.length;
  runState.running = false;
  persist();
  await appendAudit(state.session.name || "Officer", "verification_completed", bid.id, `Score ${score}/100 (${risk}). Flags: ${bid.flags.join(", ")||"none"}.`);
  render(true);
}
async function commitDecision(bid, decision, note){
  const draft = ensureDraft(bid);
  draft.pending = true;
  render(true);
  await sleep(250);
  // If the injected adapter exposes a server-side helper, prefer the server-backed decision API
  try{
    if(window.gemServer && typeof window.gemServer.decide === 'function'){
      const actor = (state.session && (state.session.name || state.session.empId || state.session.company)) || 'Officer';
      // map local action ids to server action names
      const map = { approved:'approve', clarification:'clarification', rejected:'reject' };
      const serverAction = map[decision] || decision;
      await window.gemServer.decide(bid.id, serverAction, actor, note);
      // adapter refreshed localStorage; sync into runtime
      await fetchServerState();
      decisionDraft = null;
      toast(`Decision recorded: ${statusLabel(decision)}.`);
      return;
    }
  }catch(e){ console.warn('Server decision failed, falling back to local commit', e); }

  // Fallback local-only commit (offline/demo mode)
  draft.pending = true;
  await sleep(550);
  bid.status = decision; bid.officerNote = note; bid.decidedAt = new Date().toISOString();
  persist();
  await appendAudit(state.session.name || "Officer", "decision_"+decision, bid.id, note);
  decisionDraft = null;
  render(true);
  toast(`Decision recorded: ${statusLabel(decision)}.`);
}

/* =======================================================================
   HELPERS
======================================================================= */
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}
function formatDateTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"}) + ", " + d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
}

// Try to synchronise client state from the server (adapter may also write
// to localStorage). Non-blocking; preserves any active session.
async function fetchServerState(){
  try{
    const bidsRes = await fetch('/api/bids');
    if(!bidsRes.ok) throw new Error('no bids');
    const bids = await bidsRes.json();
    const auditRes = await fetch('/api/audit');
    const audit = auditRes.ok ? await auditRes.json() : [];
    let bidders = [];
    try{
      const biddersRes = await fetch('/api/bidders');
      if(biddersRes.ok) bidders = await biddersRes.json();
    }catch(err){}
    // preserve session, but replace bids/auditLog/bidders with authoritative server state
    const sess = state.session;
    state = Object.assign({}, state, { bids: bids, auditLog: audit, bidders: bidders, chainSeeded: true });
    state.session = sess;
    persist();
    render(true);
    return {ok:true};
  }catch(e){ console.warn('Could not fetch server state', e); return {ok:false, error:String(e)}; }
}
